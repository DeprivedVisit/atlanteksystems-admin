<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EcoPollo Cartago — Bosquejo Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--d:#F0C300;--v:#2D5A1B;--vc:#4A7C2C;--g:#6C757D;--gs:#EDE5D0;--c:#FFF8EE;--orange:#E8730A;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:#c8c0b4;min-height:100vh;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(15,30,8,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(240,195,0,0.2);}
.nav-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #F0C300;}
.nav-actions{display:flex;align-items:center;gap:8px;}
.nav-wa{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#25D366;color:white;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700;transition:background 0.2s;}
.nav-wa:hover{background:#1DAA53;}
.nav-menu-wrap{position:relative;}
.nav-menu-btn{padding:8px 13px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:20px;color:white;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;line-height:1;}
.nav-menu-btn:hover{background:rgba(255,255,255,0.18);}
.nav-menu-btn.open{background:rgba(240,195,0,0.18);border-color:rgba(240,195,0,0.5);color:#F0C300;}
.nav-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:rgba(12,28,6,0.97);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;min-width:175px;box-shadow:0 14px 40px rgba(0,0,0,0.45);overflow:hidden;z-index:700;}
.nav-dropdown.open{display:block;animation:fadeDown 0.18s ease-out;}
.nav-dropdown a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,0.75);text-decoration:none;font-size:13px;font-weight:600;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.05);}
.nav-dropdown a:last-child{border-bottom:none;}
.nav-dropdown a:hover{background:rgba(240,195,0,0.1);color:#F0C300;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* JUMP BAR */
.jump-bar{position:sticky;top:62px;z-index:100;background:rgba(10,24,5,0.96);backdrop-filter:blur(10px);padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(240,195,0,0.12);}
.jump-bar::-webkit-scrollbar{display:none;}
.jump-btn{padding:5px 12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:14px;color:rgba(255,255,255,0.65);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;transition:all 0.15s;flex-shrink:0;}
.jump-btn:hover{background:rgba(240,195,0,0.14);color:var(--d);border-color:rgba(240,195,0,0.3);}

/* CATALOG WRAP */
.catalog-wrap{padding:16px 16px 40px;max-width:940px;margin:0 auto;}
.catalog-label{text-align:center;font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(0,0,0,0.28);text-transform:uppercase;margin-bottom:10px;margin-top:4px;}

/* CATALOG PAGE CARD */
.cat-page{
  background:white;
  border-radius:3px;
  box-shadow:0 8px 32px rgba(0,0,0,0.22),0 2px 6px rgba(0,0,0,0.1);
  overflow:hidden;
  margin-bottom:28px;
  display:flex;
  flex-direction:column;
  scroll-margin-top:108px;
}

/* ── PORTADA ── */
.portada-body{flex:1;padding:52px 44px 28px;text-align:center;}
.portada-title{
  font-family:'DM Sans',sans-serif;
  font-size:clamp(26px,4.5vw,50px);
  font-weight:700;
  letter-spacing:-0.5px;
  color:#1a1a1a;
  text-transform:uppercase;
  line-height:1.2;
  margin-bottom:42px;
}
.portada-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 36px;max-width:620px;margin:0 auto;}
.portada-cat-btn{
  background:linear-gradient(150deg,#3d8424,#5ab538);
  color:white;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  padding:13px 18px;
  border:none;
  border-radius:7px;
  cursor:pointer;
  text-align:left;
  box-shadow:3px 3px 0 rgba(0,0,0,0.13),inset 0 1px 0 rgba(255,255,255,0.18);
  transition:all 0.18s;
  text-decoration:none;
  display:block;
}
.portada-cat-btn:hover{transform:translateY(-2px);box-shadow:4px 6px 0 rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.18);}
.portada-cat-btn.blue{background:linear-gradient(150deg,#1a3d9c,#2a5acc);text-align:center;grid-column:1/-1;}
.portada-cat-btn.center{text-align:center;}
.portada-note{font-size:10px;color:#aaa;margin-top:14px;font-style:italic;}

/* ── CATEGORY HEADER ── */
.cat-header{padding:22px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;}
.cat-ribbon{
  background:linear-gradient(135deg,#2D5A1B,#4A7C2C);
  color:white;
  font-weight:800;
  font-size:clamp(14px,2.5vw,20px);
  letter-spacing:2.5px;
  text-transform:uppercase;
  padding:12px 46px 12px 18px;
  clip-path:polygon(0 0, 87% 0, 100% 50%, 87% 100%, 0 100%);
  min-width:190px;
  line-height:1;
}
.cat-icon-badge{
  font-size:36px;
  opacity:0.55;
  margin-top:2px;
}

/* ── PRODUCT DISPLAY GRID ── */
.prod-display{
  flex:1;
  padding:24px 28px 18px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:20px 16px;
  align-items:start;
}
.prod-display-card{text-align:center;}
.prod-display-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:5px;
  display:block;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}
.prod-display-cod{
  margin-top:9px;
  font-size:11px;
  font-weight:800;
  color:#1a1a1a;
  letter-spacing:0.4px;
}
.prod-display-name{
  margin-top:3px;
  font-size:11.5px;
  color:#555;
  text-transform:uppercase;
  letter-spacing:0.3px;
  line-height:1.35;
}
.prod-display-unit{
  display:inline-block;
  margin-top:5px;
  background:var(--v);
  color:white;
  font-size:9px;
  font-weight:800;
  letter-spacing:0.5px;
  padding:2px 7px;
  border-radius:4px;
}

/* ── WAVE FOOTER ── */
.page-footer{margin-top:auto;}
.page-wave{display:block;width:100%;height:68px;}
.page-strip{
  background:var(--v);
  padding:10px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.page-strip-note{color:rgba(255,255,255,0.45);font-size:10px;flex:1;min-width:0;}
.inicio-btn{
  background:var(--d);
  color:#1a1a1a;
  font-weight:800;
  font-size:11px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  padding:8px 20px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
  box-shadow:2px 2px 0 rgba(0,0,0,0.14);
  flex-shrink:0;
  transition:all 0.15s;
}
.inicio-btn:hover{transform:translateY(-1px);box-shadow:3px 3px 0 rgba(0,0,0,0.2);}
.ep-logo-wrap{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.ep-logo-wrap img{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--d);object-fit:cover;}
.ep-logo-text{color:white;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;line-height:1.4;}
.ep-logo-text em{display:block;font-style:italic;font-family:'Fraunces',serif;font-size:10.5px;font-weight:400;color:rgba(255,255,255,0.7);letter-spacing:0;}

/* FOOTER */
footer{background:#2D5A1B;padding:20px;text-align:center;color:rgba(255,255,255,0.5);font-size:12px;}
footer a{color:var(--d);text-decoration:none;margin:0 8px;}

@media(max-width:600px){
  .portada-body{padding:36px 20px 20px;}
  .portada-grid{grid-template-columns:1fr;gap:9px;max-width:280px;}
  .portada-cat-btn.blue,.portada-cat-btn.center{grid-column:auto;}
  .prod-display{grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 14px 12px;}
  .cat-header{padding:16px 14px 0;}
  .cat-ribbon{font-size:13px;min-width:150px;padding:10px 36px 10px 14px;}
  .page-strip{padding:9px 14px;}
  .catalog-wrap{padding:12px 10px 32px;}
}
</style>
</head>

<script>
var PRODUCTOS = [
  {id:'c01',nombre:'Ala Entera',         unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c02',nombre:'Centro De Ala',      unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c03',nombre:'Cuarto De Muslo',    unidad:'KG', cat:'Con Hueso',  img:'bg/bg-07.png'},
  {id:'c04',nombre:'Hígados',            unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c05',nombre:'Menudo Corriente',   unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c06',nombre:'Menudo Especial',    unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c07',nombre:'Mollejas',           unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c08',nombre:'Muslito De Muslo',   unidad:'KG', cat:'Con Hueso',  img:'bg/bg-07.png'},
  {id:'c09',nombre:'Muslo De Ala',       unidad:'KG', cat:'Con Hueso',  img:'bg/bg-07.png'},
  {id:'c10',nombre:'Muslo Entero',       unidad:'KG', cat:'Con Hueso',  img:'bg/bg-07.png'},
  {id:'c11',nombre:'Patas',              unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'c12',nombre:'Pechuga Con Hueso',  unidad:'KG', cat:'Con Hueso',  img:'bg/bg-03.png'},
  {id:'c13',nombre:'Carcasa',            unidad:'KG', cat:'Con Hueso',  img:'bg/bg-02.png'},
  {id:'d01',nombre:'Carnitas',           unidad:'KG', cat:'Deshuesado', img:'bg/bg-03.png'},
  {id:'d02',nombre:'Fillete',            unidad:'KG', cat:'Deshuesado', img:'bg/bg-03.png'},
  {id:'d03',nombre:'Lomitos',            unidad:'KG', cat:'Deshuesado', img:'bg/bg-03.png'},
  {id:'d04',nombre:'Muslo Deshuesado',   unidad:'KG', cat:'Deshuesado', img:'bg/bg-07.png'},
  {id:'d05',nombre:'Palomitas',          unidad:'KG', cat:'Deshuesado', img:'bg/bg-03.png'},
  {id:'d06',nombre:'Pechuga Corte 3×3',  unidad:'KG', cat:'Deshuesado', img:'bg/bg-03.png'},
  {id:'d07',nombre:'Pechuga Deshuesada', unidad:'KG', cat:'Deshuesado', img:'bg/bg-03.png'},
  {id:'e01',nombre:'Pollo Limpio',       unidad:'KG', cat:'Entero',     img:'bg/bg-01.png'},
  {id:'e02',nombre:'Trozo Especial',     unidad:'KG', cat:'Entero',     img:'bg/bg-01.png'},
  {id:'e03',nombre:'Trozo Marinado',     unidad:'KG', cat:'Entero',     img:'bg/bg-01.png'},
  {id:'f01',nombre:'Medallones 200g',    unidad:'UND',cat:'Formados',   img:'bg/bg-04.png'},
  {id:'f02',nombre:'Muslitos Emp. 6u',   unidad:'UND',cat:'Formados',   img:'bg/bg-04.png'},
  {id:'f03',nombre:'Tortas De Pollo 4u', unidad:'UND',cat:'Formados',   img:'bg/bg-04.png'},
  {id:'f04',nombre:'Alitas Emp. 500g',   unidad:'UND',cat:'Formados',   img:'bg/bg-02.png'},
  {id:'f05',nombre:'Chicharrón Pollo',   unidad:'UND',cat:'Formados',   img:'bg/bg-04.png'},
  {id:'m01',nombre:'Chorizo Parrillero', unidad:'UND',cat:'Embutidos',  img:'bg/bg-05.png'},
  {id:'m02',nombre:'Jamón 250g',         unidad:'UND',cat:'Embutidos',  img:'bg/bg-05.png'},
  {id:'m03',nombre:'Mortadela De Pollo', unidad:'KG', cat:'Embutidos',  img:'bg/bg-05.png'},
  {id:'m04',nombre:'Salchichón Granel',  unidad:'KG', cat:'Embutidos',  img:'bg/bg-05.png'},
  {id:'m05',nombre:'Tocineta 300g',      unidad:'UND',cat:'Embutidos',  img:'bg/bg-05.png'},
  {id:'h01',nombre:'Huevo EcoPollo',     unidad:'KG', cat:'Huevo',      img:'bg/bg-06.png'},
  {id:'p01',nombre:'Papa Frita 1Kg',     unidad:'UND',cat:'Papa',       img:'bg/bg-09.png'},
  {id:'p02',nombre:'Papa Frita 2.5Kg',   unidad:'UND',cat:'Papa',       img:'bg/bg-09.png'},
  {id:'t01',nombre:'Fillet Tilapia 9.5lb',unidad:'UND',cat:'Tilapia',  img:'bg/bg-08.png'},
  {id:'t02',nombre:'Tilapia Caja 3"–5"', unidad:'UND',cat:'Tilapia',   img:'bg/bg-08.png'},
  {id:'i01',nombre:'Hielo',              unidad:'KG', cat:'Hielo',      img:'bg/bg-09.png'}
];

var CATS = [
  {key:'Con Hueso',  label:'CORTE CON HUESO',    icon:'🍗'},
  {key:'Deshuesado', label:'CORTE DESHUESADO',   icon:'🥩'},
  {key:'Entero',     label:'POLLO ENTERO',        icon:'🐓'},
  {key:'Formados',   label:'FORMADOS',            icon:'❄️'},
  {key:'Embutidos',  label:'EMBUTIDOS',           icon:'🌭'},
  {key:'Huevo',      label:'HUEVO FRESCO',        icon:'🥚'},
  {key:'Papa',       label:'PAPAS PARA FREIR',    icon:'🍟'},
  {key:'Tilapia',    label:'TILAPIA',             icon:'🐟'},
  {key:'Hielo',      label:'HIELO',               icon:'🧊'}
];

function catId(cat){ return 'sec-' + cat.key.replace(/\s+/g,'-').toLowerCase(); }

function waveSVG() {
  return '<svg class="page-wave" viewBox="0 0 900 68" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M0,68 L0,42 C150,14 300,52 450,34 C600,16 750,60 900,18 L900,68 Z" fill="#E8730A"/>'
    + '</svg>';
}

function epLogo() {
  return '<div class="ep-logo-wrap">'
    + '<img src="Logo.jpg" alt="EcoPollo">'
    + '<div class="ep-logo-text">ECOPOLLO<em>Premium</em></div>'
    + '</div>';
}

function buildPortada(cats) {
  var btns = cats.map(function(cat){
    return '<a href="#'+catId(cat)+'" class="portada-cat-btn">'+cat.icon+' '+cat.label+'</a>';
  });
  btns.push('<a href="https://wa.me/50663144171" target="_blank" class="portada-cat-btn blue">📞 CONTÁCTANOS</a>');

  return '<div id="portada" class="cat-page" style="scroll-margin-top:108px;">'
    + '<div class="portada-body">'
      + '<h1 class="portada-title">CATÁLOGO DE PRODUCTOS<br>ECOPOLLO</h1>'
      + '<div class="portada-grid">'+btns.join('')+'</div>'
      + '<p class="portada-note">Dale click a los botones para navegar</p>'
    + '</div>'
    + '<div class="page-footer">'
      + waveSVG()
      + '<div class="page-strip">'
        + '<span class="page-strip-note">Imágenes con fines ilustrativos. Aplican restricciones.</span>'
        + epLogo()
      + '</div>'
    + '</div>'
  + '</div>';
}

function buildCatPage(cat, prods) {
  var id = catId(cat);
  var cards = prods.map(function(p){
    var cod = 'COD:EP-' + p.id.toUpperCase();
    return '<div class="prod-display-card">'
      + '<img class="prod-display-img" src="'+p.img+'" alt="'+p.nombre+'" loading="lazy">'
      + '<div class="prod-display-cod">'+cod+'</div>'
      + '<div class="prod-display-name">'+p.nombre+'</div>'
      + '<span class="prod-display-unit">'+p.unidad+'</span>'
    + '</div>';
  }).join('');

  return '<div id="'+id+'" class="cat-page">'
    + '<div class="cat-header">'
      + '<div class="cat-ribbon">'+cat.label+'</div>'
      + '<div class="cat-icon-badge">'+cat.icon+'</div>'
    + '</div>'
    + '<div class="prod-display">'+cards+'</div>'
    + '<div class="page-footer">'
      + waveSVG()
      + '<div class="page-strip">'
        + '<a href="#portada" class="inicio-btn">INICIO</a>'
        + epLogo()
      + '</div>'
    + '</div>'
  + '</div>';
}

function buildJumpBar(cats) {
  var bar = document.getElementById('jump-bar');
  var html = '<a href="#portada" class="jump-btn">📋 Índice</a>';
  cats.forEach(function(cat){
    html += '<a href="#'+catId(cat)+'" class="jump-btn">'+cat.icon+' '+cat.label+'</a>';
  });
  bar.innerHTML = html;
}

function build() {
  var activeCats = CATS.filter(function(cat){
    return PRODUCTOS.some(function(p){ return p.cat === cat.key; });
  });

  buildJumpBar(activeCats);

  var html = buildPortada(activeCats);
  activeCats.forEach(function(cat){
    var prods = PRODUCTOS.filter(function(p){ return p.cat === cat.key; });
    html += buildCatPage(cat, prods);
  });

  document.getElementById('catalog-pages').innerHTML = html;
}

function toggleNavMenu(){
  var open = document.getElementById('nav-menu-btn').classList.toggle('open');
  document.getElementById('nav-dropdown').classList.toggle('open', open);
}
document.addEventListener('click', function(e){
  var w = document.querySelector('.nav-menu-wrap');
  if(w && !w.contains(e.target)){
    document.getElementById('nav-menu-btn').classList.remove('open');
    document.getElementById('nav-dropdown').classList.remove('open');
  }
});

build();
