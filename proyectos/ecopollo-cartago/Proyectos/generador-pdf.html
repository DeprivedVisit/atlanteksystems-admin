<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EcoPollo — Generador de Listas de Precios</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#2D5A1B;--vc:#4A7C2C;--d:#F0C300;
  --bg:#F8F5EE;--card:#fff;--gs:#EDE5D0;
  --txt:#1A1A1A;--mid:#5a6e5f;--soft:#8a9e90;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* ── TOOLBAR ── */
.toolbar{background:rgba(15,30,8,.95);backdrop-filter:blur(12px);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(240,195,0,.2);}
.tb-logo{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
.tb-logo img{width:36px;height:36px;border-radius:50%;border:2px solid var(--d);object-fit:cover;}
.tb-sep{width:1px;height:28px;background:rgba(255,255,255,.15);margin:0 4px;}
.tb-tabs{display:flex;gap:4px;flex:1;}
.tb-tab{padding:8px 16px;border:none;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);transition:all .2s;}
.tb-tab.active{background:var(--d);color:var(--v);}
.tb-tab:hover:not(.active){background:rgba(255,255,255,.15);color:#fff;}
.tb-actions{display:flex;gap:8px;margin-left:auto;}
.btn-edit{padding:8px 16px;border:1.5px solid rgba(255,255,255,.25);background:none;color:rgba(255,255,255,.7);border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-edit:hover{border-color:#fff;color:#fff;}
.btn-edit.active-edit{background:rgba(244,162,97,.15);border-color:rgba(244,162,97,.5);color:#f4a261;}
.btn-pdf{padding:9px 20px;background:var(--d);color:var(--v);border:none;border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-pdf:hover{background:#e0b400;transform:translateY(-1px);box-shadow:0 4px 12px rgba(240,195,0,.3);}

/* ── HEADER INFO ── */
.page-header{max-width:980px;margin:28px auto 0;padding:0 20px;}
.page-info{background:var(--card);border-radius:14px;border:1.5px solid var(--gs);padding:20px 24px;display:flex;align-items:center;gap:20px;}
.pi-icon{font-size:2rem;flex-shrink:0;}
.pi-text h2{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--v);margin-bottom:4px;}
.pi-text p{font-size:.82rem;color:var(--mid);line-height:1.5;}
.pi-fecha{margin-left:auto;text-align:right;flex-shrink:0;}
.pi-fecha label{font-size:.72rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px;}
.pi-fecha input{border:1.5px solid var(--gs);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:.82rem;color:var(--txt);background:var(--bg);outline:none;}
.pi-fecha input:focus{border-color:var(--v);}

/* ── TABLA ── */
.main-wrap{max-width:980px;margin:20px auto 60px;padding:0 20px;}
.cat-block{margin-bottom:20px;}
.cat-title{font-family:'Fraunces',serif;font-size:.95rem;color:var(--v);padding:10px 0 8px;border-bottom:2px solid var(--gs);margin-bottom:0;display:flex;align-items:center;gap:8px;}
.price-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:0 0 12px 12px;overflow:hidden;border:1.5px solid var(--gs);border-top:none;}
.price-table th{background:var(--v);color:#fff;padding:10px 14px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;}
.price-table th:last-child{text-align:right;}
.price-table td{padding:9px 14px;font-size:.82rem;border-bottom:1px solid var(--gs);vertical-align:middle;}
.price-table tr:last-child td{border-bottom:none;}
.price-table tr:nth-child(even) td{background:rgba(237,229,208,.3);}
.td-cod{color:var(--soft);font-size:.72rem;font-weight:700;width:52px;}
.td-nombre{font-weight:600;color:var(--txt);}
.td-unidad{color:var(--mid);font-size:.75rem;width:50px;text-align:center;}
.td-precio{font-weight:800;color:var(--v);text-align:right;width:110px;}
.price-input{width:90px;border:1.5px solid var(--d);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:.82rem;font-weight:700;color:var(--v);text-align:right;background:rgba(240,195,0,.06);outline:none;}
.price-input:focus{border-color:var(--v);background:#fff;}

/* ── ESTADO ── */
.save-bar{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--v);color:#fff;border-radius:50px;padding:12px 28px;font-weight:700;font-size:.88rem;box-shadow:0 8px 24px rgba(45,90,27,.35);display:flex;align-items:center;gap:10px;z-index:200;}
.save-bar.show{display:flex;}
.btn-save-real{background:var(--d);color:var(--v);border:none;border-radius:30px;padding:8px 20px;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;}
.btn-discard{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);border-radius:30px;padding:8px 16px;font-family:inherit;font-size:.8rem;cursor:pointer;}

/* ── PRINT STYLES ── */
@media print {
  body{background:#fff;font-size:10pt;}
  .toolbar,.save-bar,.no-print{display:none!important;}
  .page-header,.main-wrap{max-width:100%;margin:0;padding:0;}
  .page-info{border:none;padding:0 0 12pt 0;border-bottom:2pt solid var(--v);margin-bottom:16pt;border-radius:0;}
  .pi-fecha input{border:none;background:transparent;padding:0;}
  .cat-block{page-break-inside:avoid;margin-bottom:14pt;}
  .price-table{border:1pt solid #ccc;}
  .price-table th{background:var(--v)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .price-table tr:nth-child(even) td{background:rgba(237,229,208,.4)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .price-input{border:none;background:transparent;text-align:right;font-weight:800;color:var(--v);}
  .pi-fecha label{display:none;}
}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .tb-tabs{gap:2px;}
  .tb-tab{padding:7px 10px;font-size:.74rem;}
  .tb-actions{gap:6px;}
  .btn-edit{padding:7px 10px;font-size:.74rem;}
  .btn-pdf{padding:7px 14px;font-size:.78rem;}
  .price-table td,.price-table th{padding:7px 10px;}
}
</style>

  </div>
</div>

<!-- TABLA PRINCIPAL -->
<div class="main-wrap" id="mainWrap"></div>

var CAT_ICONS = {"CORTE CON HUESO":"🍗","CORTE DESHUESADO":"🥩","EMBUTIDOS":"🌭","HUEVO":"🥚","TILAPIA":"🐟","PAPA":"🍟","HIELO":"🧊","SERVICIO":"🚚"};
var CAT_INFO = {
  "ND-LOCAL":    {icon:"🏪", label:"Lista ND-Local",    desc:"Distribuidoras y negocios locales · Precios en ₡ · Sujeto a cambios"},
  "CARNICERIA":  {icon:"🔪", label:"Lista Carnicería",  desc:"Carnicerías y negocios especializados · Precios en ₡ · Sujeto a cambios"},
  "MAYORISTA":   {icon:"🏭", label:"Lista Mayorista",   desc:"Clientes mayoristas y distribuidores · Precios en ₡ · Sujeto a cambios"}
};

var catActiva = 'ND-LOCAL';
var modoEdicion = false;
var cambiosPendientes = false;

/* ── LOAD / SAVE localStorage ── */
function cargarDesdeStorage() {
  try {
    var s = localStorage.getItem('ep-precios');
    if (s) {
      var datos = JSON.parse(s);
      Object.keys(datos).forEach(function(cat) {
        if (CATALOGOS_BASE[cat]) {
          var mapa = {};
          datos[cat].forEach(function(p){ mapa[p.cod + '_' + cat] = p.precio; });
          CATALOGOS_BASE[cat].forEach(function(p){
            var k = p.cod + '_' + cat;
            if (mapa[k] !== undefined) p.precio = mapa[k];
          });
        }
      });
    }
  } catch(e){}
}

function guardarCambios() {
  var guardado = {};
  Object.keys(CATALOGOS_BASE).forEach(function(cat) {
    guardado[cat] = CATALOGOS_BASE[cat].map(function(p){ return {cod:p.cod, precio:p.precio}; });
  });
  localStorage.setItem('ep-precios', JSON.stringify(guardado));
  cambiosPendientes = false;
  document.getElementById('saveBar').classList.remove('show');
  renderTabla();
}

function descartarCambios() {
  cargarDesdeStorage();
  cambiosPendientes = false;
  document.getElementById('saveBar').classList.remove('show');
  renderTabla();
}

/* ── RENDER ── */
function setCatalogo(cat, btn) {
  if (cambiosPendientes) { if (!confirm('Tenés cambios sin guardar. ¿Continuar?')) return; descartarCambios(); }
  catActiva = cat;
  document.querySelectorAll('.tb-tab').forEach(function(t){ t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var info = CAT_INFO[cat];
  document.getElementById('piIcon').textContent = info.icon;
  document.getElementById('piTitle').textContent = info.label;
  document.getElementById('piDesc').textContent = info.desc;
  renderTabla();
}

function renderTabla() {
  var prods = CATALOGOS_BASE[catActiva] || [];
  var cats = {};
  prods.forEach(function(p) {
    var c = p.categ || 'OTROS';
    if (!cats[c]) cats[c] = [];
    cats[c].push(p);
  });

  var html = '';
  var orden = ["CORTE CON HUESO","CORTE DESHUESADO","EMBUTIDOS","HUEVO","TILAPIA","PAPA","HIELO","SERVICIO"];
  orden.forEach(function(cat) {
    if (!cats[cat] || !cats[cat].length) return;
    var icon = CAT_ICONS[cat] || '📦';
    html += '<div class="cat-block">';
    html += '<div class="cat-title">'+icon+' '+cat.charAt(0)+cat.slice(1).toLowerCase()+'</div>';
    html += '<table class="price-table">';
    html += '<thead><tr><th>Cód.</th><th>Producto</th><th>Unidad</th><th>Precio ₡</th></tr></thead><tbody>';
    cats[cat].forEach(function(p) {
      html += '<tr>';
      html += '<td class="td-cod">'+p.cod+'</td>';
      html += '<td class="td-nombre">'+p.nombre+'</td>';
      html += '<td class="td-unidad">'+p.unidad+'</td>';
      if (modoEdicion) {
        html += '<td class="td-precio"><input class="price-input" type="number" value="'+p.precio+'" data-cod="'+p.cod+'" data-cat="'+catActiva+'" onchange="actualizarPrecio(this)" min="0" step="1"></td>';
      } else {
        html += '<td class="td-precio">₡ '+p.precio.toLocaleString('es-CR')+'</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  });

  document.getElementById('mainWrap').innerHTML = html;
}

function toggleEdit() {
  modoEdicion = !modoEdicion;
  var btn = document.getElementById('btnEdit');
  btn.textContent = modoEdicion ? '✓ Vista normal' : '✏️ Editar precios';
  btn.classList.toggle('active-edit', modoEdicion);
  renderTabla();
}

function actualizarPrecio(input) {
  var cod = input.dataset.cod;
  var cat = input.dataset.cat;
  var nuevo = parseInt(input.value) || 0;
  var lista = CATALOGOS_BASE[cat] || [];
  lista.forEach(function(p) { if (p.cod === cod) p.precio = nuevo; });
  cambiosPendientes = true;
  document.getElementById('saveBar').classList.add('show');
}
