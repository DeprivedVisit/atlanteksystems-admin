<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTEC · Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <!-- ══════════ NAV ══════════ -->
  <header class="dnav">
    <div class="container dnav__inner">
      <a href="index.html" class="logo">
        <svg class="logo__signal" viewBox="0 0 24 18" aria-hidden="true">
          <path d="M4 16 a8 8 0 0 1 13 -6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M8 17 a4.5 4.5 0 0 1 7.5 -3.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1.8" fill="currentColor"/>
        </svg>
        <span class="logo__text">
          <span class="logo__word">iNTEC</span>
          <span class="logo__sub">Dashboard</span>
        </span>
      </a>
      <div class="dnav__right">
        <span class="sync-badge" id="sync-badge">● Cargando…</span>
        <a href="admin.html" class="btn btn--ghost btn--sm">Gestión</a>
        <a href="index.html" class="btn btn--ghost btn--sm">Sitio</a>
      </div>
    </div>
  </header>

  <main class="container dash">

    <div class="dash__head">
      <div>
        <h1>Resumen del negocio</h1>
        <p class="dash__sub" id="dash-updated">—</p>
      </div>
      <button class="btn btn--red btn--sm" id="btn-refresh">↻ Actualizar</button>
    </div>

    <!-- KPIs -->
    <section class="kpis" id="kpis" aria-label="Indicadores"></section>

    <!-- Facturación por mes -->
    <section class="panel">
      <div class="panel__head">
        <h2>Facturación por mes</h2>
        <span class="panel__note">Proformas enviadas + facturas (₡)</span>
      </div>
      <div class="bars" id="bars"></div>
    </section>

    <div class="dash__grid">
      <!-- Últimos documentos -->
      <section class="panel">
        <div class="panel__head">
          <h2>Últimos documentos</h2>
          <a href="admin.html#/documentos" class="panel__link">Ver todos →</a>
        </div>
        <div class="tablewrap">
          <table class="table" id="docs-table">
            <thead>
              <tr><th>Nº</th><th>Tipo</th><th>Cliente</th><th>Estado</th><th class="ta-r">Total</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Leads del sitio -->
      <section class="panel">
        <div class="panel__head">
          <h2>Leads del sitio web</h2>
          <span class="panel__note" id="leads-note"></span>
        </div>
        <ul class="leads" id="leads-list"></ul>
      </section>
    </div>

  </main>

  <footer class="dfoot">
    <div class="container">
      <p>Desarrollado por <a href="https://apexcloudworkscompany.com" target="_blank" rel="noopener">Apex Cloud Work</a> — Cartago, CR</p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
