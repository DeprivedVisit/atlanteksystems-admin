<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Documento — Atlantek Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=4"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#1a6aff;--navy-dark:#0d52cc;--navy-light:#3b82f6;--navy-glow:rgba(26,106,255,.4);
      --ink:#0f172a;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--line-2:#cbd5e1;
      --bg:#f8fafc;--card:#ffffff;--green:#10b981;--amber:#f59e0b;--red:#ef4444;
      --radius:12px;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
      --container:1200px;
    }
    body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased}
    .container{width:min(var(--container),calc(100% - 44px));margin-inline:auto;padding-block:3rem}
    .doc-header{background:linear-gradient(135deg,var(--ink) 0%,#1e293b 100%);color:#fff;border-radius:var(--radius);padding:2.5rem;margin-bottom:2rem;box-shadow:0 10px 30px rgba(15,23,42,.3)}
    .doc-header-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1.5rem;margin-bottom:1.5rem}
    .brand-name{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
    .brand-sub{font-size:.85rem;color:rgba(255,255,255,.7);margin-top:.4rem;line-height:1.6;font-family:var(--mono)}
    .doc-id{text-align:right}
    .doc-type{font-family:var(--mono);font-size:.6rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:.3rem}
    .doc-number{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
    .badge{display:inline-flex;align-items:center;gap:.5rem;margin-top:.75rem;padding:.4rem 1rem;border-radius:999px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
    .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .doc-dates{display:flex;gap:2rem;flex-wrap:wrap;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.15)}
    .dd-label{font-family:var(--mono);font-size:.6rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.2rem}
    .dd-value{font-size:.95rem;font-weight:700}
    .parties{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem}
    .party{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:var(--radius);padding:1.5rem}
    .party-title{font-family:var(--mono);font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);margin-bottom:.75rem}
    .party-name{font-size:1.1rem;font-weight:800;margin-bottom:.5rem}
    .party-detail{font-size:.85rem;color:var(--muted);line-height:1.7}
    .section-label{font-family:var(--mono);font-size:.6rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
    table{width:100%;border-collapse:collapse;margin-bottom:1.5rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    th{background:var(--ink);color:#fff;font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.75rem 1rem;text-align:left}
    th:last-child,th:nth-child(2),th:nth-child(3){text-align:right}
    td{font-size:.9rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);vertical-align:top}
    td:last-child{text-align:right;font-weight:800;color:var(--navy);white-space:nowrap;font-family:var(--mono)}
    td:nth-child(2){text-align:center;font-family:var(--mono);font-weight:600}
    td small{display:block;font-size:.75rem;font-weight:400;color:var(--muted);line-height:1.55;margin-top:.2rem}
    tr.subtotal td{background:#f8fafc;color:var(--muted);font-size:.85rem}
    tr.subtotal td:last-child{color:var(--muted);font-weight:700}
    tr.total td{background:var(--ink);font-weight:800;font-size:1rem;border-bottom:none;color:#fff}
    tr.total td:last-child{color:var(--navy-light);font-size:1.15rem}
    .payment{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem}
    .pay-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
    .pay-title{font-family:var(--mono);font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);margin-bottom:.75rem}
    .pay-method{font-size:.85rem;color:var(--muted);display:flex;gap:.5rem;margin-bottom:.4rem}
    .pay-method::before{content:"→";color:var(--navy);font-weight:700}
    .pay-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.85rem}
    .pay-row:last-child{border-bottom:none;font-weight:800;padding-top:.75rem;font-size:.95rem}
    .pay-row:last-child span:last-child{color:var(--navy);font-family:var(--mono)}
    .pay-label{color:var(--muted)}
    .note{background:rgba(26,106,255,.08);border-left:3px solid var(--navy);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.25rem;font-size:.85rem;color:#1e3a5f;line-height:1.7;margin-bottom:1.25rem}
    .note--slate{background:rgba(15,23,42,.08);border-left-color:var(--ink);color:var(--ink)}
    footer{background:var(--ink);color:rgba(255,255,255,.5);text-align:center;padding:1.5rem 1rem;font-family:var(--mono);font-size:.7rem;margin-top:3rem;border-top:2px solid var(--navy)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--font);font-size:.85rem;font-weight:700;letter-spacing:.4px;text-decoration:none;border:1px solid transparent;border-radius:8px;padding:.75rem 1.5rem;cursor:pointer;transition:background .18s,color .18s,border-color .18s,transform .12s,box-shadow .18s}
    .btn:active{transform:translateY(1px)}
    .btn--navy{background:var(--navy);color:#fff;box-shadow:0 4px 20px var(--navy-glow)}
    .btn--navy:hover{background:var(--navy-dark);box-shadow:0 8px 28px var(--navy-glow)}
    .btn--ghost{background:transparent;color:var(--ink);border-color:var(--line)}
    .btn--ghost:hover{border-color:var(--ink)}
    .status-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:8px}
    .status-borrador{background:rgba(255,255,255,.15);color:#fff}
    .status-enviada{background:rgba(59,130,246,.2);color:#93c5fd}
    .status-pagada{background:rgba(16,185,129,.2);color:#6ee7b7}
    @media print{.no-print{display:none}body{background:#fff}.doc-header,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.container{padding-block:1.25rem}}
    @media(max-width:680px){.parties,.payment{grid-template-columns:1fr}.doc-id{text-align:left}.doc-header{padding:1.5rem}.brand-name{font-size:1.4rem}.doc-number{font-size:1.25rem}table{font-size:.8rem}th,td{padding:.5rem .75rem}}
  </style>
</head>
<body>
  <div class="container">
    <div id="sheet"><div style="padding:80px 46px;text-align:center;color:#333"><h2 style="font-size:22px;margin-bottom:10px">Cargando documento…</h2></div></div>
  </div>
  <footer>
    Atlantek Systems · Seguridad · CCTV · Redes · 70201 Guápiles, Pococí, Costa Rica
  </footer>
  <script src="assets/js/proforma-publica.js"></script>
  <script src="assets/js/ver-proforma.js"></script>
</body>
</html>
