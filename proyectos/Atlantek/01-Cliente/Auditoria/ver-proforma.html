<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantek Systems · Documento</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

  <!-- ══════════ BARRA SUPERIOR (no se imprime) ══════════ -->
  <div class="docview__bar no-print">
    <div class="docview__bar-left" style="display:flex;align-items:center;gap:14px">
      <img src="assets/img/logo-atlantek-white.svg" alt="ATLANTEK Systems" style="height:38px;width:auto;max-width:160px;object-fit:contain">
      <b>ATLANTEK · Seguridad · CCTV · Redes</b>
    </div>
    <div class="docview__bar-right">
      <button class="btn btn--ghost" id="v-wa">WhatsApp</button>
      <button class="btn btn--navy" id="v-print">Imprimir / PDF</button>
    </div>
  </div>

  <!-- ══════════ LA HOJA ══════════ -->
  <div class="docview" id="docview">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="docview__bar no-print" style="position:static;justify-content:center;gap:8px">
    <span style="color:var(--muted)">Documento emitido por Atlantek — Guápiles, Pococí · WhatsApp 7231-2225</span>
  </div>

  <script src="assets/js/proforma-publica.js"></script>
  <script src="assets/js/ver-proforma.js"></script>
</body>
</html>
