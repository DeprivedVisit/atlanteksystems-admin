<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantek Systems · Documento</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

  <!-- ══════════ BARRA SUPERIOR (no se imprime) ══════════ -->
  <div class="docview__bar no-print">
    <div class="docview__bar-left" style="display:flex;align-items:center;gap:10px">
      <img src="assets/img/logo-atlantek-white.svg" alt="ATLANTEK Systems" style="width:22px;height:22px;object-fit:contain">
      <b>ATLANTEK · Seguridad · CCTV · Redes</b>
    </div>
    <div class="docview__bar-right">
      <button class="btn btn--ghost" id="v-wa">WhatsApp</button>
      <button class="btn btn--red" id="v-print">Imprimir / PDF</button>
    </div>
  </div>

  <!-- ══════════ LA HOJA ══════════ -->
  <div class="docview" id="docview">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="docview__bar no-print" style="position:static;justify-content:center;gap:8px">
    <span style="color:var(--muted)">Documento emitido por Atlantek — Guápiles, Pococí · WhatsApp 7231-2225</span>
  </div>

  <script src="assets/js/proforma-publica.js"></script>
  <script src="assets/js/ver-proforma.js"></script>
</body>
</html>
