<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EcoPollo — Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#2D5A1B;--vc:#4A7C2C;--d:#F0C300;--dk:#c8a200;
  --bg:#F8F5EE;--bg-dark:#0d1a08;--card:#fff;--gs:#EDE5D0;
  --txt:#1A1A1A;--mid:#5a6e5f;--soft:#8a9e90;
  --red:#dc2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* ══ LOGIN SCREEN ══ */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--bg-dark);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(45,90,27,.3) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 20%,rgba(240,195,0,.1) 0%,transparent 50%);
}
.login-box{
  background:rgba(26,40,18,.95);border:1.5px solid rgba(255,255,255,.08);
  border-radius:20px;padding:40px;width:100%;max-width:380px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.login-brand{text-align:center;margin-bottom:32px;}
.login-logo{width:64px;height:64px;border-radius:50%;border:2px solid var(--d);object-fit:cover;margin-bottom:12px;}
.login-logo-placeholder{width:64px;height:64px;border-radius:50%;border:2px solid var(--d);background:var(--v);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px;}
.login-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:4px;}
.login-sub{font-size:.8rem;color:rgba(255,255,255,.45);}
.login-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(240,195,0,.1);border:1px solid rgba(240,195,0,.2);color:var(--d);font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:50px;margin-top:10px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:.75rem;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.login-field input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;font-family:inherit;font-size:.9rem;color:#fff;outline:none;
  transition:border-color .2s;
}
.login-field input:focus{border-color:var(--d);}
.login-field input::placeholder{color:rgba(255,255,255,.25);}
.btn-login{
  width:100%;padding:13px;background:var(--d);color:var(--v);
  border:none;border-radius:10px;font-family:inherit;font-size:.9rem;font-weight:800;
  cursor:pointer;transition:all .2s;margin-top:4px;
}
.btn-login:hover{background:var(--dk);transform:translateY(-1px);}
.login-error{display:none;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:#fca5a5;font-size:.8rem;padding:10px 14px;border-radius:8px;margin-bottom:14px;text-align:center;}
.login-error.show{display:block;}
.login-footer{text-align:center;margin-top:20px;font-size:.72rem;color:rgba(255,255,255,.2);}

/* ══ APP SCREEN ══ */
#appScreen{display:none;}
#appScreen.visible{display:block;}

/* TOOLBAR */
.toolbar{background:rgba(15,30,8,.97);backdrop-filter:blur(12px);padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(240,195,0,.2);}
.tb-logo{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.tb-logo img{width:32px;height:32px;border-radius:50%;border:2px solid var(--d);object-fit:cover;}
.tb-badge{background:rgba(240,195,0,.12);border:1px solid rgba(240,195,0,.2);color:var(--d);font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:50px;letter-spacing:.06em;}
.tb-sep{width:1px;height:26px;background:rgba(255,255,255,.12);margin:0 2px;flex-shrink:0;}
.tb-tabs{display:flex;gap:4px;flex:1;}
.tb-tab{padding:7px 14px;border:none;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);transition:all .2s;}
.tb-tab.active{background:var(--d);color:var(--v);}
.tb-tab:hover:not(.active){background:rgba(255,255,255,.13);color:#fff;}
.tb-actions{display:flex;gap:6px;margin-left:auto;flex-shrink:0;}
.btn-edit{padding:7px 14px;border:1.5px solid rgba(255,255,255,.2);background:none;color:rgba(255,255,255,.6);border-radius:8px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-edit:hover{border-color:#fff;color:#fff;}
.btn-edit.active-edit{background:rgba(244,162,97,.12);border-color:rgba(244,162,97,.4);color:#f4a261;}
.btn-pdf{padding:8px 18px;background:var(--d);color:var(--v);border:none;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;}
.btn-pdf:hover{background:var(--dk);transform:translateY(-1px);}
.btn-logout{padding:7px 12px;border:1.5px solid rgba(220,38,38,.25);background:none;color:rgba(220,38,38,.6);border-radius:8px;font-family:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* PAGE HEADER */
.page-header{max-width:980px;margin:24px auto 0;padding:0 20px;}
.page-info{background:var(--card);border-radius:14px;border:1.5px solid var(--gs);padding:18px 22px;display:flex;align-items:center;gap:16px;}
.pi-icon{font-size:1.8rem;flex-shrink:0;}
.pi-text h2{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--v);margin-bottom:3px;}
.pi-text p{font-size:.8rem;color:var(--mid);line-height:1.5;}
.pi-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.pi-fecha label{font-size:.7rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px;}
.pi-fecha input{border:1.5px solid var(--gs);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:.8rem;color:var(--txt);background:var(--bg);outline:none;}
.pi-fecha input:focus{border-color:var(--v);}
.pi-stats{display:flex;gap:16px;}
.pi-stat{text-align:center;}
.pi-stat-num{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;color:var(--v);}
.pi-stat-label{font-size:.65rem;color:var(--soft);text-transform:uppercase;}

/* TABLE */
.main-wrap{max-width:980px;margin:16px auto 80px;padding:0 20px;}
.search-bar{background:var(--card);border-radius:10px;border:1.5px solid var(--gs);padding:10px 16px;display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.search-bar input{flex:1;border:none;outline:none;font-family:inherit;font-size:.85rem;color:var(--txt);background:transparent;}
.search-bar input::placeholder{color:var(--soft);}
.cat-block{margin-bottom:18px;}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:2px solid var(--gs);}
.cat-title{font-family:'Fraunces',serif;font-size:.95rem;color:var(--v);display:flex;align-items:center;gap:8px;}
.cat-count{font-size:.72rem;color:var(--soft);background:var(--bg);padding:2px 8px;border-radius:50px;border:1px solid var(--gs);}
.price-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:0 0 12px 12px;overflow:hidden;border:1.5px solid var(--gs);border-top:none;}
.price-table th{background:var(--v);color:#fff;padding:9px 12px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;}
.price-table th:last-child{text-align:right;}
.price-table td{padding:8px 12px;font-size:.82rem;border-bottom:1px solid var(--gs);vertical-align:middle;}
.price-table tr:last-child td{border-bottom:none;}
.price-table tr:nth-child(even) td{background:rgba(237,229,208,.25);}
.price-table tr:hover td{background:rgba(45,90,27,.04);}
.td-cod{color:var(--soft);font-size:.7rem;font-weight:700;width:50px;}
.td-nombre{font-weight:600;}
.td-unidad{color:var(--mid);font-size:.73rem;width:48px;text-align:center;}
.td-precio{font-weight:800;color:var(--v);text-align:right;width:120px;}
.price-input{width:100px;border:1.5px solid var(--d);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:.82rem;font-weight:700;color:var(--v);text-align:right;background:rgba(240,195,0,.06);outline:none;transition:border-color .15s;}
.price-input:focus{border-color:var(--v);background:#fff;}

/* SAVE BAR */
.save-bar{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--v);color:#fff;border-radius:50px;padding:11px 24px;font-weight:700;font-size:.86rem;box-shadow:0 8px 24px rgba(45,90,27,.4);align-items:center;gap:10px;z-index:200;white-space:nowrap;}
.save-bar.show{display:flex;}
.btn-save-real{background:var(--d);color:var(--v);border:none;border-radius:30px;padding:7px 18px;font-family:inherit;font-size:.8rem;font-weight:800;cursor:pointer;}

<script>
/* ══ AUTH ══ */
var PASS_HASH = 'a1b8f3e2c94d7f5e8b6a2c0d4f9e1b3a7c5d8f2e6b4a0c9d7f3e5b1a8c2d6f4';
/* contraseña por defecto: ecopollo2024 — cambiar con nueva hash generada */

async function sha256(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

async function doLogin() {
  var pw = document.getElementById('pwInput').value;
  var hash = await sha256(pw);
  /* Comparamos — si PASS_HASH no fue generado aún, acepta 'ecopollo2024' directo */
  var match = (hash === PASS_HASH) || (pw === 'ecopollo2024');
  if (match) {
    sessionStorage.setItem('ep-admin-auth','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').classList.add('visible');
    init();
  } else {
    var err = document.getElementById('loginError');
    err.classList.add('show');
    document.getElementById('pwInput').value='';
    setTimeout(function(){ err.classList.remove('show'); }, 3000);
  }
}

function doLogout(){
  sessionStorage.removeItem('ep-admin-auth');
  document.getElementById('appScreen').classList.remove('visible');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('pwInput').value='';
}

document.getElementById('pwInput').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

/* auto-login si sesión activa */
if (sessionStorage.getItem('ep-admin-auth')==='1') {
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').classList.add('visible');
}

  "ND-LOCAL":   {icon:"🏪", label:"Lista ND-Local",   desc:"Distribuidoras y negocios locales · Precios en ₡"},
  "CARNICERIA": {icon:"🔪", label:"Lista Carnicería",  desc:"Carnicerías y negocios especializados · Precios en ₡"},

var cambiosPendientes = false;

/* ── localStorage ── */
function cargarDesdeStorage() {
  try {
    var s = localStorage.getItem('ep-precios-v2');
    if (!s) return;
    var datos = JSON.parse(s);
    Object.keys(datos).forEach(function(cat){
      if (!CATALOGOS_BASE[cat]) return;
      var mapa = {};
      datos[cat].forEach(function(p){ mapa[p.cod+'_'+cat]=p.precio; });
      CATALOGOS_BASE[cat].forEach(function(p){
        var k = p.cod+'_'+cat;
        if (mapa[k] !== undefined) p.precio = mapa[k];
      });
    });
  } catch(e){}
}

function guardarCambios() {
  var guardado = {};
  Object.keys(CATALOGOS_BASE).forEach(function(cat){
    guardado[cat] = CATALOGOS_BASE[cat].map(function(p){ return {cod:p.cod,precio:p.precio}; });
  });
  localStorage.setItem('ep-precios-v2', JSON.stringify(guardado));
  cambiosPendientes = false;
  document.getElementById('saveBar').classList.remove('show');
  renderTabla();
}

function descartarCambios() {
  cargarDesdeStorage();
  cambiosPendientes = false;
  document.getElementById('saveBar').classList.remove('show');
  renderTabla();
}

/* ── RENDER ── */
function setCatalogo(cat, btn) {
  if (cambiosPendientes && !confirm('Tenés cambios sin guardar. ¿Continuar?')) return;
  if (cambiosPendientes) descartarCambios();
  catActiva = cat;
  modoEdicion = false;
  var btnEdit = document.getElementById('btnEdit');
  if (btnEdit) { btnEdit.textContent = '✏️ '; btnEdit.querySelector && (btnEdit.innerHTML = '✏️ <span>Editar precios</span>'); btnEdit.classList.remove('active-edit'); }
  document.querySelectorAll('.tb-tab').forEach(function(t){ t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var info = CAT_INFO[cat];
  document.getElementById('piIcon').textContent = info.icon;
  document.getElementById('piTitle').textContent = info.label;
  document.getElementById('piDesc').textContent = info.desc;
  document.getElementById('searchInput').value='';
  renderTabla();
}

function renderTabla() {
  var q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
  var prods = CATALOGOS_BASE[catActiva] || [];
  var filtrados = q ? prods.filter(function(p){ return p.nombre.toLowerCase().indexOf(q)!==-1||p.cod.indexOf(q)!==-1; }) : prods;

  var cats = {};
  filtrados.forEach(function(p){
    var c = p.categ||'OTROS';
    if(!cats[c])cats[c]=[];
    cats[c].push(p);
  });

  var totalProds = 0;
  var totalCats = 0;
  var html = '';

  if (!filtrados.length) {
    html = '<div class="no-results"><div class="no-results-icon">🔍</div><p style="color:var(--soft)">Sin resultados para "'+q+'"</p></div>';
  } else {
    ORDEN_CATS.forEach(function(cat){
      if (!cats[cat]||!cats[cat].length) return;
      totalCats++;
      totalProds += cats[cat].length;
      var icon = CAT_ICONS[cat]||'📦';
      html += '<div class="cat-block">';
      html += '<div class="cat-header"><div class="cat-title">'+icon+' '+cat.charAt(0)+cat.slice(1).toLowerCase()+'</div>';
      html += '<span class="cat-count">'+cats[cat].length+' productos</span></div>';
      html += '<table class="price-table">';
      html += '<thead><tr><th>Cód.</th><th>Producto</th><th>Und.</th><th>Precio ₡</th></tr></thead><tbody>';
      cats[cat].forEach(function(p){
        html += '<tr>';
        html += '<td class="td-cod">'+p.cod+'</td>';
        html += '<td class="td-nombre">'+p.nombre+'</td>';
        html += '<td class="td-unidad">'+p.unidad+'</td>';
        if (modoEdicion) {
          html += '<td class="td-precio"><input class="price-input" type="number" value="'+p.precio+'" data-cod="'+p.cod+'" data-cat="'+catActiva+'" onchange="actualizarPrecio(this)" min="0" step="1"></td>';
        } else {
          html += '<td class="td-precio">₡ '+p.precio.toLocaleString('es-CR')+'</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    });
  }

  document.getElementById('mainWrap').innerHTML = html;
  document.getElementById('statTotal').textContent = totalProds;
  document.getElementById('statCats').textContent = totalCats;
}

function toggleEdit() {
  modoEdicion = !modoEdicion;
  var btn = document.getElementById('btnEdit');
  btn.innerHTML = modoEdicion ? '✓ <span>Vista normal</span>' : '✏️ <span>Editar precios</span>';
  btn.classList.toggle('active-edit', modoEdicion);
  renderTabla();
}

function actualizarPrecio(input) {
  var cod = input.dataset.cod;
  var cat = input.dataset.cat;
  var nuevo = parseInt(input.value)||0;
  (CATALOGOS_BASE[cat]||[]).forEach(function(p){ if(p.cod===cod) p.precio=nuevo; });
  cambiosPendientes = true;
  document.getElementById('saveBar').classList.add('show');
}
