# ══════════════════════════════════════════════════════════════
#  nginx.conf — Apex Cloud Works
#  Garett Barrantes Benavides · Cartago, Costa Rica
#  Ruta: /etc/nginx/sites-available/apex-cloudworks
#  Activar: sudo ln -s /etc/nginx/sites-available/apex-cloudworks /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.apexcloudworkcompany.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — solo API (el frontend estático vive en S3 + CloudFront, no acá)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.apexcloudworkcompany.com;

    # SSL — Certbot lo rellena automáticamente
    ssl_certificate     /etc/letsencrypt/live/api.apexcloudworkcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.apexcloudworkcompany.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de seguridad
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/apex-api.access.log;
    error_log  /var/log/nginx/apex-api.error.log;

    # Tamaño máximo de upload (archivos de clientes)
    client_max_body_size 25M;

    # WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Node.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
